services:
  dev:
    build:
      context: .
      target: dev
    volumes:
      - .:/app
      - go-cache:/root/go/pkg/mod
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - LRV_MODEL=${LRV_MODEL:-}
      - LRV_TIMEOUT=${LRV_TIMEOUT:-120}
    working_dir: /app
    stdin_open: true
    tty: true
    command: sleep infinity

volumes:
  go-cache:
